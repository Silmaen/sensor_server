# nginx front (topology A): serves static + media (incl. OTA firmware) from disk
# and reverse-proxies everything else — including WebSocket — to Daphne.
# TLS is terminated by an EXTERNAL reverse proxy in front of this nginx.

# WebSocket upgrade plumbing (Channels /ws/…).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme the external proxy saw (it sets X-Forwarded-Proto for TLS);
# fall back to this hop's scheme when the header is absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Keep health probes out of the access log (the external proxy may poll /healthz/
# frequently); everything else is logged normally.
map $request_uri $loggable {
    default        1;
    ~^/healthz/    0;
}

upstream app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log combined if=$loggable;

    # Firmware images can be a few hundred KB–1 MB; the publication upload (A3)
    # is proxied to Daphne, so allow a generous body.
    client_max_body_size 16m;

    # Local health probe for nginx itself — answered directly, without proxying
    # to the app, so it does not depend on Daphne or ALLOWED_HOSTS. Probed over
    # 127.0.0.1 (nginx listens on IPv4; `localhost` may resolve to ::1).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/media/;
    }

    # Device-facing firmware download (frozen contract URL: /fw/<hw>/<rev>/<version>.bin).
    # Unauthenticated by design (trusted filtered LAN, HTTP + MD5).
    location /fw/ {
        alias /srv/media/fw/;
        access_log off;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
