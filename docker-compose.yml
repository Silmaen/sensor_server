services:
  mosquitto:
    # `2` already resolved to this exact digest (it is the same image as `2.1-alpine`
    # and `latest`), so pinning the patch changes nothing that runs — it only puts the
    # running version in git instead of in a registry alias.
    image: eclipse-mosquitto:2.1.2-alpine
    labels:
      # Anchored on the 2.1 line, not on `\d+\.\d+`: 2.1 deprecated `password_file`
      # (which mosquitto.conf still uses) in favour of the password-file plugin, and
      # announced its removal for 3.0. Leaving the next major inside the regex would
      # turn "wud is green" into "the broker will stop reading its passwd file on the
      # next pull". Bumping this regex is where that migration gets decided.
      wud.tag.include: '^2\.1\.\d+-alpine$$'
    ports:
      - "${MQTT_EXPOSED_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - ${DATA_DIR}/mosquitto:/mosquitto/data
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - sensor_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-u", "${MQTT_USER}", "-P", "${MQTT_PASSWORD}", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  timescaledb:
    # Same image `latest-pg16` points to today, pinned so the TimescaleDB version is
    # reviewable in a diff. A pull that changes the extension version needs
    # `ALTER EXTENSION timescaledb UPDATE;` afterwards — see README.
    image: timescale/timescaledb:2.29.1-pg16
    labels:
      # The pg major stays fixed on purpose: `latest-pg17`/`latest-pg18` exist and are
      # "greater", but moving there is a pg_upgrade of the data directory, never
      # something to inherit from a pull. `-oss` variants are excluded by the anchor.
      wud.tag.include: '^\d+\.\d+\.\d+-pg16$$'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR}/timescaledb:/var/lib/postgresql/data
    networks:
      - sensor_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.0-alpine
    labels:
      # Kept inside the 8 line, and `-alpine` anchored: unconstrained, wud offers
      # `32bit-stretch` as an upgrade, and `8.10.0-alpine3.23` is the same image under
      # a longer name. Redis here only carries the Channels layer and the cache, so the
      # 7 → 8 jump costs nothing (no persistent state worth migrating).
      wud.tag.include: '^8\.\d+\.\d+-alpine$$'
    volumes:
      - ${DATA_DIR}/redis:/data
    networks:
      - sensor_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    labels:
      # Built here, so it exists in no registry: wud was looking up
      # `library/sensor_server-web:latest` on Docker Hub and reporting a 401 for it.
      # Nothing is lost by excluding it — what this image tracks is the base image of
      # web/Dockerfile (python:3.13-slim), which `deploy.sh` pulls and rebuilds against.
      wud.watch: 'false'
    expose:
      - "8000"
    volumes:
      - ${DATA_DIR}/logs:/app/logs
      - ${DATA_DIR}/media:/app/media
      - staticfiles:/app/staticfiles
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      MEDIA_ROOT: /app/media
      OTA_PUBLISH_TOKEN: ${OTA_PUBLISH_TOKEN:-}
      OTA_BASE_URL: ${OTA_BASE_URL:-}
      OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID}
      OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET}
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${OIDC_OP_AUTHORIZATION_ENDPOINT}
      OIDC_OP_TOKEN_ENDPOINT: ${OIDC_OP_TOKEN_ENDPOINT}
      OIDC_OP_USER_ENDPOINT: ${OIDC_OP_USER_ENDPOINT}
      OIDC_OP_JWKS_ENDPOINT: ${OIDC_OP_JWKS_ENDPOINT}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - sensor_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.30.4-alpine
    labels:
      # nginx numbers the stable branch with even minors (1.30) and mainline with odd
      # ones (1.31), and mainline is always "greater" — a `^1\.\d+\.\d+-alpine$` regex
      # would report this container as permanently behind. Staying inside 1.30 keeps
      # the signal on stable patches; changing branch is a deliberate edit here.
      wud.tag.include: '^1\.30\.\d+-alpine$$'
    ports:
      - "${WEB_EXPOSED_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
      - ${DATA_DIR}/media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - sensor_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sensor_net:
    driver: bridge

volumes:
  staticfiles:
