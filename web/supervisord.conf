[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:daphne]
# Access log disabled (--access-log /dev/null): nginx fronts the stack and logs
# HTTP access. Otherwise Daphne floods this container's stdout with one line per
# request — notably the /healthz/ healthcheck every 30s — burying the MQTT worker
# (sensor) logs. App errors/tracebacks still go to stderr.
command=daphne -b 0.0.0.0 -p 8000 --access-log /dev/null sensor_server.asgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mqtt_worker]
command=python manage.py mqtt_worker
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
